{{- range $db := .Values.databases }}
{{- $name := $db.name | required "databases[].name is required" }}
{{- $database := $db.database | default $name }}
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  rootPasswordSecretKeyRef:
    generate: true
    name: {{ $name }}-root
    key: password
  database: {{ $database }}
  replicas: {{ $db.replicas | default 1 }}
  port: {{ $db.port | default 3306 }}
  storage:
    size: {{ dig "storage" "size" "1Gi" $db }}
    storageClassName: {{ dig "storage" "storageClassName" "longhorn" $db | quote }}
  resources:
    requests:
      cpu: {{ dig "resources" "requests" "cpu" "100m" $db | quote }}
      memory: {{ dig "resources" "requests" "memory" "256Mi" $db | quote }}
    limits:
      cpu: {{ dig "resources" "limits" "cpu" "500m" $db | quote }}
      memory: {{ dig "resources" "limits" "memory" "512Mi" $db | quote }}
{{- end }}
